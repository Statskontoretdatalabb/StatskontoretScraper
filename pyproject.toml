[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statskontoret-scraper"
version = "0.1.0"
description = "Scrape Statskontoret's public websites and publish their text as structured open data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dataset = [
    "huggingface_hub>=0.34.0",
    "markdownify>=1.1.0",
    "pyarrow>=20.0.0",
    "scrapy>=2.13.0",
]
ip-rotator = [
    "httpx[http2]>=0.28.1",
    "httpx-ip-rotator>=0.1.4",
]

[project.scripts]
statskontoret-scraper = "statskontoret_scraper.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
statskontoret_scraper = ["sources.json"]

[tool.setuptools.packages.find]
include = ["statskontoret_scraper*"]
