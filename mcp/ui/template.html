<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myndighetsnyckeltal</title>
<style>
:root{font-family:var(--font-sans,system-ui,sans-serif);color-scheme:light dark;color:var(--color-text-primary,light-dark(#183733,#e8f2ef));background:var(--color-background-primary,light-dark(#fff,#162520))}*{box-sizing:border-box}body{margin:0;padding:24px;line-height:1.5}h1{font-size:clamp(1.35rem,3vw,1.9rem);line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}p{margin:8px 0 20px;max-width:72ch}#subtitle,#source,#hover{font-variant-numeric:tabular-nums}#subtitle{opacity:.8}#legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:16px 0}label{display:flex;align-items:baseline;gap:8px;font-size:.9rem}input{width:16px;height:16px}input:focus-visible,a:focus-visible{outline:3px solid #2b9f91;outline-offset:3px}#chart{display:block;width:100%;height:310px;overflow:visible}#hover{min-height:1.5em;font-size:.9rem;margin-bottom:16px}details{border-top:1px solid light-dark(#cad6d3,#52635b);padding-top:14px}summary{cursor:pointer;font-weight:600;padding:4px 0}summary:focus-visible{outline:3px solid #2b9f91;outline-offset:3px}.table-scroll{overflow:auto;max-height:340px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}th,td{padding:10px 12px;border-bottom:1px solid light-dark(#dce5e2,#465950);text-align:right;white-space:nowrap}th:first-child{text-align:left;white-space:normal;min-width:150px}thead{background:light-dark(#eaf1ee,#213b30)}#note,#source{font-size:.8rem;margin:14px 0 0;color:var(--color-text-secondary,light-dark(#475f58,#bed0c7))}#status{padding:28px 0}::selection{background:#b6e1d3;color:#13352c}@media(max-width:480px){body{padding:16px}#legend{gap:10px}label{font-size:.8rem}}
</style></head><body>
<p id="status" role="status">Hämtar årsserier från assistenten…</p>
<main id="content" hidden><h1 id="title"></h1><p id="subtitle"></p><div id="legend" role="group" aria-label="Visa myndigheter i diagrammet"></div>
<svg id="chart" role="img" aria-label="Årsserier för valda myndigheter"></svg><div id="hover" aria-live="polite">Peka på en punkt eller använd tabbtangenten för att läsa värdet.</div>
<details open><summary>Värden i tabell</summary><div class="table-scroll"><table id="values"></table></div></details>
<p id="note"></p><p id="source"></p></main><script>/* APP_BUNDLE */</script></body></html>
