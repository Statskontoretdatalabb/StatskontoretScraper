name: Sync MCP Space

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - ".github/workflows/sync-mcp-space.yml"
  workflow_dispatch:

jobs:
  sync-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Sync MCP directory to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx --from huggingface_hub==1.11.0 hf upload \
            Statskontoretdatalabb/StatskontoretMCP mcp . \
            --repo-type space \
            --delete "*" \
            --commit-message "Sync MCP Space from GitHub"
