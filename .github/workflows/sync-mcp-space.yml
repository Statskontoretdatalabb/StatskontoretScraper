name: Sync MCP Space

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - ".github/workflows/sync-mcp-space.yml"
  workflow_dispatch:

jobs:
  sync-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Upload to the existing MCP Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uvx --from huggingface_hub==2.2.0 hf upload
          Statskontoretdatalabb/StatskontoretMCP mcp .
          --repo-type space
          --commit-message "Deploy ${GITHUB_SHA}"
